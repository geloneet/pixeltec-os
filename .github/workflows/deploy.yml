# Deploy manual de PixelTEC OS — pipeline endurecido (E0g-3, ADR-0028).
#
# Reemplaza al deploy automático por push (causa raíz del incidente E0 del
# 2026-07-28: pull+build+prune en cada push a main, sin validar el contrato).
# Reglas de este pipeline:
#   - SOLO workflow_dispatch: nada se despliega por push.
#   - environment `production`: NO reactivar este workflow hasta que el
#     Environment exista en GitHub con required reviewers (gate de aprobación).
#   - SHA completo obligatorio, validado como ancestro de origin/main; el
#     script de deploy se extrae DE ESE SHA y corre con checkout detached en el
#     VPS — jamás `git pull` ni "lo último" implícito.
#   - `validate:egress --profile=predeploy` antes de build/restart; capabilities
#     solo por inputs aprobados (mínimo privilegio).
#   - Imagen etiquetada por SHA + rollback automático; SIN `docker image prune`
#     (la limpieza de imágenes es un gate separado que conserva ≥2 versiones).
#   - Credencial: secret NUEVO `VPS_DEPLOY_SSH_KEY` (llave exclusiva de deploy,
#     comentario identificable, idealmente restringida en authorized_keys con
#     `command=` al script; ver §11 del gate). La llave vieja
#     `github-actions@pixeltec` quedó deshabilitada en el incidente y el secret
#     `VPS_SSH_KEY` NO debe reutilizarse. La creación/rotación de la llave es
#     una operación explícita posterior al commit de este workflow.
#   - Nunca imprimir secrets ni el contenido de .env.production; sin `set -x`.
name: Deploy PixelTEC OS (manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA hexadecimal COMPLETO (40) a desplegar — sin defaults: vacío = fallo"
        required: true
        type: string
      confirm_production:
        description: 'Escribe exactamente: deploy-production'
        required: true
        type: string
      require_r2_delete:
        description: "Exigir capability de borrado R2 (avatares)"
        required: false
        type: boolean
        default: false
      require_meta_credential_read:
        description: "Exigir capability de lectura de credenciales Meta"
        required: false
        type: boolean
        default: false
      require_meta_publish:
        description: "Exigir capability de publicación Meta"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pixeltec-os-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy manual aprobado
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Validar confirmación y formato del SHA
        env:
          CONFIRM: ${{ inputs.confirm_production }}
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "deploy-production" ] || { echo "confirm_production inválido"; exit 1; }
          echo "$SHA" | grep -qE '^[0-9a-f]{40}$' || { echo "commit_sha debe ser SHA completo (40 hex)"; exit 1; }
          echo "SHA solicitado: $SHA"

      - name: Checkout (historial completo para validar ancestría)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar que el SHA existe y es ancestro de origin/main
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$SHA^{commit}" || { echo "el SHA no existe en origin"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "el SHA no es ancestro de origin/main"; exit 1; }

      - name: Extraer el script de deploy DEL SHA solicitado
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git show "$SHA:scripts/deploy/production-deploy.sh" > /tmp/production-deploy.sh
          bash -n /tmp/production-deploy.sh

      - name: Setup SSH (credencial exclusiva de deploy)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

      - name: known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy (script versionado; health y rollback automáticos en el VPS)
        env:
          SHA: ${{ inputs.commit_sha }}
          CAP_R2: ${{ inputs.require_r2_delete }}
          CAP_MCR: ${{ inputs.require_meta_credential_read }}
          CAP_MP: ${{ inputs.require_meta_publish }}
        run: |
          set -euo pipefail
          ARGS="$SHA"
          [ "$CAP_R2" = "true" ] && ARGS="$ARGS --require-r2-delete"
          [ "$CAP_MCR" = "true" ] && ARGS="$ARGS --require-meta-credential-read"
          [ "$CAP_MP" = "true" ] && ARGS="$ARGS --require-meta-publish"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash -s -- $ARGS" < /tmp/production-deploy.sh
